name: Promptfoo Code Scan

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.prompt"
      - "**/*.prompt.yml"
      - "**/*.prompt.yaml"
      - ".github/promptfoo-scan-guidance.md"
      - "prompts/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promptfoo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promptfoo:
    name: LLM security scan
    runs-on: ubuntu-24.04
    env:
      PROMPTFOO_API_KEY: ${{ secrets.PROMPTFOO_API_KEY }}
    steps:
      - name: Skip when Promptfoo is not configured
        if: env.PROMPTFOO_API_KEY == ''
        run: echo "PROMPTFOO_API_KEY is not configured; skipping Promptfoo code scan."

      - name: Check out repository
        if: env.PROMPTFOO_API_KEY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Promptfoo code scan
        if: env.PROMPTFOO_API_KEY != ''
        uses: promptfoo/code-scan-action@11b7322013b2ba70a311b596c90dad5bcbea8634 # v0.2.2
        env:
          PROMPTFOO_API_KEY: ${{ env.PROMPTFOO_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          min-severity: medium
          guidance-file: .github/promptfoo-scan-guidance.md
