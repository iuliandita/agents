name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint prompt sources
        run: python scripts/lint_prompts.py

      - name: Check harness docs
        run: python scripts/check_harness_docs.py

      - name: Scan prompt sources for malicious instructions
        run: python scripts/scan_prompt_sources.py

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint GitHub workflows
        run: |
          actionlint_bin="$(go env GOPATH)/bin/actionlint"
          "$actionlint_bin"

      - name: Run tests
        run: python -m pytest -q

      - name: Syntax-check shell scripts
        run: bash -n scripts/sync-ai-prompts scripts/autoimprove-prompts scripts/render-invariants scripts/render-agents scripts/python-runtime.sh

      - name: Syntax-check Python scripts
        run: python -m py_compile scripts/render_prompts.py scripts/render_invariants.py scripts/lint_prompts.py scripts/scan_prompt_sources.py scripts/check_harness_docs.py scripts/render_agents.py

      - name: Check render output shape
        run: scripts/sync-ai-prompts --check

      - name: Check agent render output
        run: scripts/render-agents --check

      - name: Dry-run deploy rendering
        run: scripts/sync-ai-prompts --dry-run

  macos-setup:
    name: macOS setup smoke test
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test interpreter selection
        run: python -m pytest -q tests/test_python_runtime.py

      - name: Render with system Bash and an isolated environment
        run: |
          python3 -m venv --without-pip .venv
          /bin/bash scripts/sync-ai-prompts --target claude --check
          /bin/bash scripts/sync-ai-prompts --target claude --dry-run
          /bin/bash scripts/render-agents --target claude --check
          /bin/bash scripts/render-invariants --dry-run
