name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint prompt sources
        run: python scripts/lint_prompts.py

      - name: Check harness docs
        run: python scripts/check_harness_docs.py

      - name: Check harness contract receipts
        run: python scripts/check_harness_contract.py

      - name: Check documentation impact
        env:
          # Pull requests diff against their base; pushes to develop and main against the previous tip.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python scripts/check_docs_impact.py --base "$BASE_SHA"
          else
            python scripts/check_docs_impact.py
          fi

      - name: Check documentation links and commands
        run: python scripts/check_docs_links.py

      - name: Scan prompt sources for malicious instructions
        run: python scripts/scan_prompt_sources.py

      - name: Check stack conventions
        # Advisory: made blocking once the alignment PRs land.
        continue-on-error: true
        run: python3 .github/stack/stack-check.py

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint GitHub workflows
        run: actionlint

      - name: Syntax-check shell scripts
        run: bash -n scripts/sync-ai-prompts scripts/render-invariants scripts/render-agents scripts/render-hermes scripts/update scripts/python-runtime.sh

      - name: Check render output shape
        run: scripts/sync-ai-prompts --check

      - name: Check agent render output
        run: scripts/render-agents --check

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Syntax-check Python scripts
        run: python -m py_compile scripts/render_prompts.py scripts/render_invariants.py scripts/lint_prompts.py scripts/scan_prompt_sources.py scripts/check_harness_docs.py scripts/check_harness_contract.py scripts/check_docs_impact.py scripts/check_docs_links.py scripts/render_agents.py scripts/render_hermes.py scripts/update.py scripts/install_workflow.py

      - name: Check PowerShell launcher
        run: pwsh -NoProfile -File scripts/sync-ai-prompts.ps1 --check

      - name: Dry-run deploy rendering
        run: scripts/sync-ai-prompts --dry-run

  macos-setup:
    name: macOS setup smoke test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test interpreter selection
        run: python -m pytest -q tests/test_python_runtime.py

      - name: Render with system Bash and an isolated environment
        run: |
          python3 -m venv --without-pip .venv
          /bin/bash scripts/sync-ai-prompts --target claude --check
          /bin/bash scripts/sync-ai-prompts --target claude --dry-run
          /bin/bash scripts/render-agents --target claude --check
          /bin/bash scripts/render-invariants --dry-run

  windows-setup:
    name: Windows launcher smoke test
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Render with the PowerShell launchers
        shell: pwsh
        run: |
          ./scripts/sync-ai-prompts.ps1 --target claude --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/sync-ai-prompts.ps1 --target claude --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/render-agents.ps1 --target claude --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/render-invariants.ps1 --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
