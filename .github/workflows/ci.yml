name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt --require-hashes

      - name: Lint prompt sources
        run: python scripts/lint_prompts.py

      - name: Check harness docs
        run: python scripts/check_harness_docs.py

      - name: Check harness contract receipts
        run: python scripts/check_harness_contract.py

      - name: Check documentation impact
        env:
          # Pull requests diff against their base; pushes to develop and main against the previous tip.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python scripts/check_docs_impact.py --base "$BASE_SHA"
          else
            python scripts/check_docs_impact.py
          fi

      - name: Check documentation links and commands
        run: python scripts/check_docs_links.py

      - name: Scan prompt sources for malicious instructions
        run: python scripts/scan_prompt_sources.py

      - name: Check stack conventions
        run: python3 .github/stack/stack-check.py

      - name: Install actionlint
        env:
          # renovate: datasource=github-release-attachments depName=rhysd/actionlint
          ACTIONLINT_VERSION: "v1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint GitHub workflows
        run: actionlint

      - name: Syntax-check shell scripts
        run: bash -n scripts/sync-ai-prompts scripts/render-invariants scripts/render-agents scripts/render-hermes scripts/update scripts/python-runtime.sh

      - name: Check render output shape
        run: scripts/sync-ai-prompts --check

      - name: Check agent render output
        run: scripts/render-agents --check

  test:
    name: test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt --require-hashes

      - name: Run tests
        run: python -m pytest -q

      - name: Syntax-check Python scripts
        run: python -m py_compile scripts/*.py .github/stack/stack-check.py

      - name: Check PowerShell launcher
        run: pwsh -NoProfile -File scripts/sync-ai-prompts.ps1 --check

      - name: Dry-run deploy rendering with an isolated home
        run: |
          export HOME
          HOME="$(mktemp -d)"
          scripts/sync-ai-prompts --dry-run
          scripts/render-invariants --dry-run
          scripts/render-hermes --dry-run

  markdown:
    name: markdown
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install markdownlint-cli2
        run: |
          mkdir -p "$RUNNER_TEMP/markdownlint-cli2"
          cp .github/tools/markdownlint/package.json .github/tools/markdownlint/package-lock.json "$RUNNER_TEMP/markdownlint-cli2/"
          npm ci --prefix "$RUNNER_TEMP/markdownlint-cli2" --ignore-scripts --no-audit --no-fund
          echo "$RUNNER_TEMP/markdownlint-cli2/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Lint Markdown
        run: markdownlint-cli2

  links:
    name: links
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lychee
        env:
          # renovate: datasource=github-release-attachments depName=lycheeverse/lychee
          LYCHEE_VERSION: "lychee-v0.24.2"
          LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo /tmp/lychee.tar.gz "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  /tmp/lychee.tar.gz" | sha256sum --check
          tar -xzf /tmp/lychee.tar.gz -C "$HOME/.local/bin" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check links
        run: lychee --config lychee.toml AGENTS.md CHANGELOG.md CONTRIBUTING.md INSTALL.md README.md SECURITY.md 'docs/**/*.md'

  macos-setup:
    name: macos-setup
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt --require-hashes

      - name: Run full test suite
        run: python -m pytest -q -rs

      - name: Render with system Bash and an isolated environment
        run: |
          python3 -m venv --without-pip .venv
          /bin/bash scripts/sync-ai-prompts --target claude --check
          /bin/bash scripts/sync-ai-prompts --target claude --dry-run
          /bin/bash scripts/render-agents --target claude --check
          /bin/bash scripts/render-invariants --dry-run

  windows-setup:
    name: windows-setup
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt --require-hashes

      - name: Run full test suite
        run: python -m pytest -q -rs

      - name: Render with the PowerShell launchers
        shell: pwsh
        run: |
          ./scripts/sync-ai-prompts.ps1 --target claude --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/sync-ai-prompts.ps1 --target claude --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/render-agents.ps1 --target claude --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/render-invariants.ps1 --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
