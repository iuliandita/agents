name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check documentation impact for the release range
        run: |
          previous=""
          if [ -n "$(git tag -l 'v*' --merged "${GITHUB_REF_NAME}^")" ]; then
            previous="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^")"
          fi
          if [ -n "$previous" ]; then
            python3 scripts/check_docs_impact.py --release-tag "$GITHUB_REF_NAME" --base "$previous"
          else
            python3 scripts/check_docs_impact.py --release-tag "$GITHUB_REF_NAME"
          fi

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag \
              || gh release edit "$GITHUB_REF_NAME" --generate-notes
          fi
